# lint checks if syntax, format, indentation (Liniting) is correct or not

name: auto linter

on:
  push:
    paths: "*.py"

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - name: checkout the code
        uses: actions/checkout@v7

      - name: install ruffer
        run: pip install ruff

      - name: check file for liniting
        run: ruff check .
